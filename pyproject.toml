[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "telco_churn"
version = "0.0.1"
description = "Churn prediction on the IBM Telco customer snapshot (ESILV MLOps TP01)."
authors = [
  { name = "ESILV MLOps team" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.9.1",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["telco_churn"]
include = ["pyproject.toml", "telco_churn/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["telco_churn"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

